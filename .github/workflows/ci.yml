name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  api-lint-test:
    name: API — lint + test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neurospect
          POSTGRES_PASSWORD: neurospect
          POSTGRES_DB: neurospect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==1.8.5

      - name: Install dependencies
        run: poetry install --with dev

      - name: Lint (ruff)
        run: poetry run ruff check app/ tests/

      - name: Test
        env:
          DATABASE_URL: postgresql://neurospect:neurospect@localhost:5432/neurospect_test
          DATABASE_URL_SYNC: postgresql://neurospect:neurospect@localhost:5432/neurospect_test
          JWT_SECRET: ci-test-secret
          BROKER_CRED_SECRET: ${{ secrets.CI_BROKER_CRED_SECRET || 'Y2ktdGVzdC1rZXktMzItYnl0ZXMtZm9yLWNpLW9ubHk=' }}
          SENTRY_DSN: ""
        run: poetry run pytest tests/ -v --tb=short

  app-lint:
    name: App — lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint
